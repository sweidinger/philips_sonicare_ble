read_characteristic:
  name: Read characteristic
  description: Read a BLE characteristic from the Sonicare toothbrush (debug).
  fields:
    characteristic_uuid:
      name: Characteristic UUID
      description: The UUID of the characteristic to read.
      required: true
      example: "477ea600-a260-11e4-ae37-0002a5d54120"
      selector:
        text:

write_characteristic:
  name: Write characteristic
  description: Write data to a BLE characteristic on the Sonicare toothbrush (debug).
  fields:
    characteristic_uuid:
      name: Characteristic UUID
      description: The UUID of the characteristic to write.
      required: true
      selector:
        text:
    data:
      name: Data
      description: Hex data to write (e.g. "01" or "0100").
      required: true
      selector:
        text:

force_wake:
  name: Force wake
  description: >
    Manually trigger the wake / reconnect path (debug). Useful on stock
    bluetooth_proxy setups without a parallel local Bluetooth adapter,
    where the D-Bus RSSI fallback can't fire and habluetooth deduplicates
    the brush's static advertisements.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional — only needed when more than one Sonicare entry exists.
      required: false
      selector:
        text:

resync_sessions:
  name: Re-fetch stored sessions
  description: >
    Fetch the sessions stored on the handle again, from the given session
    number up to the newest, and announce each as a
    philips_sonicare_ble_session event (backfill true). Runs at once when
    the handle is connected, otherwise on its next connect.
  fields:
    from_session_id:
      name: From session number
      description: First session to fetch again (see the "latest session id" sensor).
      required: true
      example: 932
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    entry_id:
      name: Config entry ID
      description: Optional — only needed when more than one Sonicare entry exists.
      required: false
      selector:
        text:
